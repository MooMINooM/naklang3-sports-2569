<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจการเชื่อมต่อการแข่งขัน</title><link rel="stylesheet" href="admin.css"></head>
<body><main><h1>ตรวจการเชื่อมต่อการแข่งขัน</h1><button id="test">ทดสอบการเชื่อมต่อ</button><pre id="result" role="status"></pre><a href="./">ดูการแข่งขัน</a></main>
<script type="module">
import {readSports} from './sports-api.js?v=20261123-supabase';
const button=document.getElementById('test');
button.addEventListener('click',async()=>{button.disabled=true;const result=document.getElementById('result');result.textContent='กำลังเชื่อมต่อ Supabase…';try{const data=await readSports();result.textContent='เชื่อมต่อ Supabase สำเร็จ\nคู่แข่งขัน '+data.matches.length+' คู่\nสนาม '+data.fields.length+' สนาม';}catch(error){result.textContent=error.message;}finally{button.disabled=false;}});
button.click();
</script></body></html>
