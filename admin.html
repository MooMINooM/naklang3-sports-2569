<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>จัดการแข่งขัน · สนามกลาง นากลาง 3</title>
  <link rel="stylesheet" href="admin.css?v=20261117-bracket">
  <script type="module" src="admin.js?v=20261117-team-numbers"></script>
</head>
<body>
  <header class="top">
    <a href="./" class="brand"><span aria-hidden="true">๓</span>สนามกลาง นากลาง 3</a>
    <a href="./">ดูหน้าผู้ชม</a>
  </header>
  <main>
    <section id="login-panel" class="login">
      <h1>เข้าสู่หน้าผู้จัด</h1>
      <p>จัดตารางสนาม บันทึกผล และเผยแพร่คู่แข่งขัน</p>
      <form id="login-form">
        <label for="key">รหัสผู้จัดการแข่งขัน</label>
        <input type="password" id="key" name="key" autocomplete="current-password" required>
        <button type="submit" class="primary">เข้าสู่ระบบ</button>
      </form>
      <p id="login-status" role="status" class="status"></p>
    </section>
    <section id="workspace" hidden>
      <div class="workspace-header">
        <div><h1>จัดการแข่งขัน</h1><p id="summary"></p></div>
        <div class="actions">
          <button type="button" id="refresh">โหลดข้อมูลใหม่</button>
          <button type="button" id="logout">ออกจากระบบ</button>
          <button type="button" id="open-team-numbers">กำหนดเลขทีมโรงเรียน</button>
          <button type="button" id="open-draw">ตัดสินอันดับเมื่อเสมอ</button>
          <button type="button" id="new-match" class="primary">เพิ่มคู่แข่งขัน</button>
        </div>
      </div>
      <p id="workspace-status" class="status" role="status"></p>
      <section class="panel">
        <div class="filters">
          <label>วันแข่งขัน <select id="day-filter"></select></label>
          <label>กีฬา <select id="sport-filter"></select></label>
          <label>การเผยแพร่
            <select id="published-filter">
              <option value="">ทั้งหมด</option><option value="published">เผยแพร่แล้ว</option><option value="draft">ฉบับร่าง</option>
            </select>
          </label>
        </div>
        <div id="matches"></div>
      </section>
    </section>
  </main>
  <dialog id="match-dialog">
    <form id="match-form">
      <h2 id="form-title"></h2>
      <div class="form-grid">
        <label>วันแข่งขัน <select name="day" required></select></label>
        <label>เวลาเริ่ม <input name="start" type="time" required></label>
        <label>กีฬา <select name="sport" required></select></label>
        <label>รุ่น <select name="level" required></select></label>
        <label>ประเภท <select name="type" required></select></label>
        <label>สนาม <select name="field" required></select></label>
        <label>ทีมที่ 1 <input name="home" list="schools" maxlength="100" required></label>
        <label>ทีมที่ 2 <input name="away" list="schools" maxlength="100" required></label>
        <label>รอบแข่งขัน <select name="stage" required></select></label>
        <label id="group-field">สาย <select name="group"><option value="A">กลุ่ม A</option><option value="B">กลุ่ม B</option><option value="C">กลุ่ม C</option></select></label>
        <label>คะแนนทีมที่ 1 <input name="homeScore" type="number" min="0" max="999"></label>
        <label>คะแนนทีมที่ 2 <input name="awayScore" type="number" min="0" max="999"></label>
      </div>
      <div id="tie-field" hidden><label>ผู้ชนะกรณีตัดสินเมื่อคะแนนเท่ากัน <select name="tieWinner"></select></label></div>
      <p id="score-hint" class="status" role="status"></p>
      <datalist id="schools"></datalist>
      <label class="publish"><input name="published" type="checkbox"> แสดงคู่นี้ในหน้าผู้ชม</label>
      <p id="form-status" class="status" role="status"></p>
      <div class="actions form-actions">
        <button type="button" id="cancel-match">ยกเลิก</button>
        <button type="submit" id="save-match" class="primary">บันทึกคู่แข่งขัน</button>
      </div>
    </form>
  </dialog>
  <dialog id="draw-dialog">
    <form id="draw-form">
      <h2>ตัดสินอันดับเมื่อสถิติเท่ากัน</h2>
      <label>รายการแข่งขัน <select name="event" required></select></label>
      <label id="draw-tie">ลำดับตัดสินเมื่อสถิติเท่ากัน <input name="tieOrder" placeholder="A1, B2, C1" maxlength="80" aria-describedby="draw-tie-help">
        <small id="draw-tie-help">ใช้เมื่อกรรมการตัดสินแล้ว ใส่รหัสทีมจากอันดับสูงไปต่ำตามผลตัดสิน</small>
      </label>
      <p id="draw-status" class="status" role="status"></p>
      <div class="actions form-actions">
        <button type="button" id="close-draw">ปิด</button>
        <button type="submit" id="save-draw" class="primary">บันทึกลำดับ</button>
      </div>
    </form>
  </dialog>
  <dialog id="team-numbers-dialog">
    <form id="team-numbers-form">
      <h2>กำหนดเลขทีมโรงเรียน</h2>
      <p>กรอกชื่อครั้งเดียว เลขเดียวกันใช้ชื่อเดียวกันในทุกกีฬาและทุกรุ่น</p>
      <div id="team-number-fields" class="form-grid"></div>
      <datalist id="number-schools"></datalist>
      <p id="team-numbers-status" class="status" role="status"></p>
      <div class="actions form-actions">
        <button type="button" id="close-team-numbers">ปิด</button>
        <button type="submit" id="save-team-numbers" class="primary">บันทึกเลขทีม</button>
      </div>
    </form>
  </dialog>
</body>
</html>
